name: lottery-cloud

on:
  schedule:
    # 哥斯达黎加时间（UTC-6）→ UTC（GitHub cron 仅支持 UTC）：
    # 11:10 → 17:10 / 13:10 → 19:10 / 15:10 → 21:10 / 16:40 → 22:40
    # 19:40 → 01:40 / 21:10 → 03:10 / 19:00(周二六日) → 01:00 / 20:10(周日) → 02:10
    # 银行对账单 09:00 → 15:00
    - cron: '10 17 * * *'
    - cron: '10 19 * * *'
    - cron: '10 21 * * *'
    - cron: '40 22 * * *'
    - cron: '40 1 * * *'
    - cron: '10 3 * * *'
    - cron: '0 1 * * 0,2,6'
    - cron: '10 2 * * 0'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '要拉取的日期 YYYY-MM-DD（留空=今天）'
        required: false
        type: string

concurrency:
  group: lottery-cloud
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Costa_Rica
      LOTTERY_USER_AGG: AGG
      LOTTERY_USER_FENG: FENG
      LOTTERY_PASS_AGG: ${{ secrets.LOTTERY_PASS_AGG }}
      LOTTERY_PASS_FENG: ${{ secrets.LOTTERY_PASS_FENG }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r cloud/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Diagnose site reachability
        run: |
          echo "--- curl with plain UA ---"
          curl -sL -o /tmp/diag.html -w "HTTP %{http_code} | size %{size_download} | final %{url_effective}\n" https://dashboardtimes.com/LuckyStar/ || echo "curl failed"
          head -c 400 /tmp/diag.html || true
          echo ""
          echo "--- curl with chrome UA ---"
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o /tmp/diag2.html -w "HTTP %{http_code} | size %{size_download} | final %{url_effective}\n" https://dashboardtimes.com/LuckyStar/ || echo "curl2 failed"
          head -c 400 /tmp/diag2.html || true

      - name: Fetch lottery & build snapshot
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python cloud/main.py --date=${{ inputs.date }}
          else
            python cloud/main.py
          fi

      - name: Commit and push snapshot
        run: |
          git config user.name 'lottery-cloud-bot'
          git config user.email 'lottery-cloud-bot@users.noreply.github.com'
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "snapshot $(TZ=America/Costa_Rica date '+%F %H:%M')"
            git push
          fi

      - name: Report
        if: always()
        run: |
          ls -la snapshot.json 2>/dev/null || echo "no snapshot.json"
